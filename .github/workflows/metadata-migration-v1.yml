name: Metadata migration v1

on:
  pull_request:
    paths:
      - scripts/migrate_metadata.py
      - scripts/knowledge.py
      - requirements-dev.txt
      - .github/workflows/metadata-migration-v1.yml
  push:
    branches:
      - main
    paths:
      - scripts/migrate_metadata.py
      - scripts/knowledge.py
      - requirements-dev.txt
      - .github/workflows/metadata-migration-v1.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Include Design System UI templates in the index
        run: |
          python - <<'PY'
          from pathlib import Path

          knowledge = Path("scripts/knowledge.py")
          knowledge_text = knowledge.read_text(encoding="utf-8")
          knowledge_text = knowledge_text.replace(
              'EXCLUDED_PARTS = {"templates"}',
              'EXCLUDED_PARTS: set[str] = set()',
          )
          knowledge.write_text(knowledge_text, encoding="utf-8")

          migration = Path("scripts/migrate_metadata.py")
          migration_text = migration.read_text(encoding="utf-8")
          migration_text = migration_text.replace(
              '    "tokens": "token",\n}',
              '    "tokens": "token",\n    "templates": "ui-template",\n}',
          )
          migration.write_text(migration_text, encoding="utf-8")
          PY

      - name: Migrate metadata
        run: python scripts/migrate_metadata.py

      - name: Regenerate manifest
        run: python scripts/knowledge.py generate

      - name: Validate migrated repository
        run: python scripts/knowledge.py check --strict

      - name: Save migration patch
        if: always()
        run: git diff --binary > metadata-migration.patch

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-migration-diagnostics
          path: |
            metadata-migration.patch
            manifest.generated.json
          if-no-files-found: warn

      - name: Create or update migration pull request
        if: success() && (github.event_name == 'push' || github.head_ref == 'chore/trigger-metadata-migration')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/metadata-migration-v1
        run: |
          if git diff --quiet; then
            echo "No metadata migration changes are required."
            exit 0
          fi

          cp metadata-migration.patch /tmp/metadata-migration.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard
          git switch -C "$BRANCH" origin/main
          git apply /tmp/metadata-migration.patch
          git add scripts/knowledge.py scripts/migrate_metadata.py products shared manifest.generated.json
          git commit -m "Migrate repository metadata to the common envelope"
          git push --force origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Migrate repository metadata to the common envelope" \
              --body "Automated metadata migration across Product, Design System, Content, Product Standard, and Shared Domain collections. The workflow regenerated the manifest and passed strict validation before opening this PR."
          else
            echo "Updated existing PR #$EXISTING_PR"
          fi
