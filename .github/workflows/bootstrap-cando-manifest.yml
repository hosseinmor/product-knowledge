name: Bootstrap Cando manifest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'docs/rename-cando-and-finalize-content-model'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Generate and validate manifest
        run: |
          python scripts/generate_manifest.py generate
          python scripts/generate_manifest.py check

      - name: Commit generated manifest
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- manifest.generated.json)" ]; then
            echo "Manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.generated.json
          git commit -m "Regenerate manifest for Cando and content migration"
          git push origin "HEAD:$BRANCH"
