name: Knowledge quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate metadata and relationships
        run: python scripts/knowledge.py validate

      - name: Generate manifest artifact
        run: python scripts/knowledge.py generate --output /tmp/manifest.generated.json

      - name: Upload generated manifest
        uses: actions/upload-artifact@v4
        with:
          name: product-knowledge-manifest
          path: /tmp/manifest.generated.json
          if-no-files-found: error
