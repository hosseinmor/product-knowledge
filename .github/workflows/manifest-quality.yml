name: Manifest quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "products/**"
      - "shared/**"
      - "templates/**"
      - "ai/**"
      - "scripts/generate_manifest.py"
      - "requirements-dev.txt"
      - "manifest.generated.json"
      - ".github/workflows/manifest-quality.yml"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Generate lightweight manifest
        run: python scripts/generate_manifest.py generate

      - name: Validate lightweight manifest
        run: python scripts/generate_manifest.py check

      - name: Commit generated manifest to pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- manifest.generated.json; then
            echo "Manifest is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.generated.json
          git commit -m "chore: regenerate knowledge manifest"
          git push

      - name: Verify main has no uncommitted manifest changes
        if: github.event_name == 'push'
        run: git diff --exit-code -- manifest.generated.json
