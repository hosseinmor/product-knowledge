name: Bootstrap lightweight manifest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'infra/lightweight-manifest-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Generate manifest
        id: generate
        run: |
          set +e
          python scripts/generate_manifest.py generate > manifest-bootstrap.log 2>&1
          code=$?
          cat manifest-bootstrap.log
          exit $code

      - name: Commit diagnostics on failure
        if: failure()
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest-bootstrap.log
          git commit -m "Record manifest bootstrap diagnostics"
          git push origin "HEAD:$BRANCH"

      - name: Validate manifest
        if: success()
        run: python scripts/generate_manifest.py check

      - name: Commit generated manifest
        if: success()
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- manifest.generated.json; then
            echo "Manifest is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.generated.json
          git commit -m "Generate lightweight retrieval manifest"
          git push origin "HEAD:$BRANCH"
