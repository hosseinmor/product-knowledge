    content:
      message: همهٔ کارجوها برای ارسال رزومه باید حداقل ۷۰٪ رزومه داشته باشند.
    expected:
      valid: false
      checked_rules: [JVC-017, JVC-018]
      violations: [JVC-017, JVC-018]

  - id: observed_priority_quota_as_global_rule
    context:
      surface: application_management
      observation: five_uses_in_thirty_days_on_test_account
