    context:
      surface: resume
      concept: resume_language_variant
    content:
      message: شما دو رزومهٔ جداگانه، فارسی و انگلیسی، دارید.
    expected:
      valid: false
      checked_rules: [JVC-009]
      violations: [JVC-009]

  - id: personal_file_collapsed_with_structured_resume
    context:
      surface: resume_upload
