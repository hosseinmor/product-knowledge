schema_version: "0.1"
id: content.eval.jobvision_candidate_context_cases
context_id: content.context.jobvision-candidate
language: fa-IR

cases:
  - id: direct_address_without_decorative_role
    context:
      surface: resume
      intent: saved_feedback
    content:
      message: رزومهٔ شما ذخیره شد.
    expected:
      valid: true
      checked_rules: [JVC-001, JVC-020]
      violations: []

  - id: job_post_metadata_uses_job_ad
    context:
      surface: job_details
      concept: job_post
    content:
      message: این آگهی شغلی ۳ روز پیش منتشر شده است.
    expected:
      valid: true
      checked_rules: [JVC-003, JVC-004]
      violations: []

  - id: role_uses_job_position
    context:
      surface: application
      concept: job_position
    content:
      message: برای این موقعیت شغلی رزومه ارسال کنید.
    expected:
      valid: true
      checked_rules: [JVC-004, JVC-007]
      violations: []

  - id: discovery_uses_job_opportunity
    context:
      surface: recommendation_landing
      concept: job_opportunity
    content:
      heading: فرصت‌های شغلی پیشنهادی شما
    expected:
      valid: true
      checked_rules: [JVC-004, JVC-016]
      violations: []

  - id: company_and_employer_actor_distinct
    context:
      surface: application_activity
      organization_visible: true
      actor_signal_visible: true
    content:
      company_label: شرکت
      message: کارفرما رزومهٔ شما را مشاهده کرده است.
    expected:
      valid: true
      checked_rules: [JVC-005, JVC-015]
      violations: []

  - id: independent_application_notification
    context:
      surface: notification
      concept: job_application
      outcome_confirmed: true
    content:
      message: درخواست شغلی شما ارسال شد.
    expected:
      valid: true
      checked_rules: [JVC-007, JVC-022]
      violations: []

  - id: contextual_application_short_form
    context:
      surface: application_details
      page_title: درخواست شغلی
    content:
      action: مشاهدهٔ درخواست
    expected:
      valid: true
      checked_rules: [JVC-007]
      violations: []

  - id: resume_language_variant
    context:
      surface: resume_language_switcher
      concept: resume_language_variant
    content:
      options: [رزومهٔ فارسی, رزومهٔ انگلیسی]
      helper: زبان نمایش رزومه را انتخاب کنید.
    expected:
      valid: true
      checked_rules: [JVC-009]
      violations: []

  - id: personal_resume_file_distinct
    context:
      surface: resume_upload
      artifact: personal_resume_file
      behavior_confirmed: true
    content:
      action: بارگذاری رزومهٔ شخصی
    expected:
      valid: true
      checked_rules: [JVC-010, JVC-018]
      violations: []

  - id: recruitment_and_hiring_distinct
    context:
      surface: educational_content
    content:
      message: مشاهدهٔ رزومه یکی از فعالیت‌های فرایند جذب است و استخدام را تضمین نمی‌کند.
    expected:
      valid: true
      checked_rules: [JVC-011, JVC-015]
      violations: []

  - id: resume_assistant_contextual_name
    context:
      surface: resume
      experience: resume_ai_assistant
      assistant_like: true
    content:
      title: دستیار هوشمند رزومه
      message: پیشنهادها را پیش از اعمال بررسی کنید.
    expected:
      valid: true
      checked_rules: [JVC-012, JVC-013]
      violations: []

  - id: employer_view_signal_only
    context:
      surface: application_activity
      observed_event: employer_viewed_resume
    content:
      message: کارفرما رزومهٔ شما را مشاهده کرده است.
    expected:
      valid: true
      checked_rules: [JVC-015]
      violations: []

  - id: cautious_recommendation
    context:
      surface: recommended_jobs
      ranking_reason_confirmed: false
    content:
      heading: آگهی‌های شغلی پیشنهادی
      message: این پیشنهادها براساس ترجیحات فعلی شما نمایش داده می‌شوند.
    expected:
      valid: true
      checked_rules: [JVC-003, JVC-016, JVC-018]
      violations: []

  - id: product_area_supplies_action_truth
    context:
      surface: saved_jobs
      owning_source: https://docs-jv.jvoffice.ir/contents/jobpost/0_overview/
      save_available: true
    content:
      message: آگهی شغلی ذخیره شد.
      action: مشاهدهٔ آگهی‌های ذخیره‌شده
    expected:
      valid: true
      checked_rules: [JVC-003, JVC-018]
      violations: []

  - id: localized_resume_percentage
    context:
      surface: resume
      value_type: percentage
      formatted_by_locale: true
    content:
      message: رزومهٔ شما ۶۵٪ تکمیل شده است.
    expected:
      valid: true
      checked_rules: [JVC-021]
      violations: []

  - id: error_inherits_pattern
    context:
      surface: application
      pattern: error
      component: Inline Notification
      retry_confirmed: true
    content:
      message: درخواست شغلی ارسال نشد.
      description: اتصال اینترنت را بررسی و دوباره تلاش کنید.
      action: تلاش دوباره
    expected:
      valid: true
      checked_rules: [JVC-007, JVC-020]
      violations: []

  - id: ats_candidate_label_on_candidate_surface
    context:
      surface: account
      role: jobseeker
    content:
      heading: اطلاعات کاندیدا
    expected:
      valid: false
      checked_rules: [JVC-001, JVC-002]
      violations: [JVC-002]

  - id: applicant_label_for_jobseeker
    context:
      surface: application_history
      role: jobseeker
    content:
