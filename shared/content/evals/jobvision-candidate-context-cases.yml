    expected:
      valid: false
      checked_rules: [JVC-007, JVC-008, JVC-022]
      violations: [JVC-007, JVC-008, JVC-022]

  - id: apply_used_as_application_entity
    context:
      surface: application_history
      concept: job_application
    content:
      heading: اپلای‌های من
    expected:
      valid: false
      checked_rules: [JVC-008]
      violations: [JVC-008]

